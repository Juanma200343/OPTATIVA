<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <button onclick="Aceptar()">Aceptar</button>
    <button onclick="Cancelar()">Cancelar</button>

    <p id="mensaje"></p>

    <script>
        function Aceptar() {
            document.getElementById("mensaje").textContent = "Está usted aceptando";
        }

        function Cancelar() {
            document.getElementById("mensaje").textContent = "Está usted cancelando";
        }
    </script>

</body>
</html>
