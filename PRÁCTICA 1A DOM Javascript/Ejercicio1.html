<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="description">
    <title>Ejercicio javascript - Instrucciones básicas DOM</title>
</head>
<body>

    <div id="saludar">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre">
        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido">
    </div>

    <p id="saludo"></p> 
    
<script> 
    // 1.1. Mostrar por consola el título tal y como está y en mayúsculas 
    const titulo = document.title; 
    console.log(titulo);
    console.log(titulo.toUpperCase()); 

    // 1.2. Cambiar el nombre de los input
    document.getElementById("nombre").value = "Isco"; 
    document.getElementById("apellido").value = "Alarcón";
    
    // 1.3. Añadir un texto a la etiqueta p con id saludo
    const saludo = document.getElementById("saludo"); saludo.textContent = "Hola Isco Alarcón";
    
    // 1.4. Añadir una etiqueta p justo debajo de la etiqueta de id saludo 
    const nuevoParrafo = document.createElement("p");
    nuevoParrafo.textContent = "¿Qué tal estás?"; saludo.insertAdjacentElement("afterend", nuevoParrafo); 
    
    // 1.5. Cambiar el texto del label apellido usando querySelector() 
    const labelApellido = document.querySelector('label[for="apellido"]'); labelApellido.textContent = "Apellidos:"; 
    
    </script>


</body>
</html>
