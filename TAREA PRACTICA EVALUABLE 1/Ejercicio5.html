<html lang="en">
<head>

    <title>Document</title>
</head>
<body>
    <script>
        var ordenador = prompt("Dame un ordenador: ");
        var modelo = prompt("Dame modelo de tu ordenador: ");
        if(ordenador == "MSI" && modelo == "PRESTIGE"){
            var descuento = 1000 * 5 /100 ;  

        }if(ordenador == "HP" && modelo == "Pavilion"){
            var descuento = 1000 * 10 /100  ;  
        }else{
            alert("No hay descuento")
        }
        document.write("El descuento es: " + descuento)
    </script>
</body>
