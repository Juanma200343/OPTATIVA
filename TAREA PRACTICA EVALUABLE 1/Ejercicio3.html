<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var num1 = parseInt(prompt("Dame num1: "));
        var num2 = parseInt(prompt("Dame num2: "));
        var opcion = prompt("Que quieres hacer: ");
        if(opcion = suma){
            var suma = prompt(num1 + num2);
            alert("La suma es: " + suma);


        }if (opcion = resta) {
            var resta = prompt(num1 - num2);
            alert("La resta es: " + resta);

        }if (opcion = multi) {
            var multi = prompt(num1 * num2);
            alert("La multiplicacion es: " + multi);

        }else{
            if(num2 = 0){
                alert("No se puede dividir entre cero");
            }else{
            var div = prompt(num1 / num2);
            alert("La division es : " + div)
        }
    }


    </script>
</body>
</html>
