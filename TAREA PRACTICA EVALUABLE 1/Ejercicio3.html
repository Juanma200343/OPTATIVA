
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operaciones</title>
</head>
<body>

    <script>
        var num1 = parseInt(prompt("Dame el primer número:"));
        var num2 = parseInt(prompt("Dame el segundo número:"));

        var suma = num1 + num2;
        var resta = num1 - num2;
        var multiplicacion = num1 * num2;

        var division;

        if (num2 === 0) {
            division = "No se puede dividir entre cero";
        } else {
            division = num1 / num2;
        }

        alert(
            "La suma es: " + suma + " "+
            "La resta es: " + resta + " "+
            "La multiplicación es: " + multiplicacion + " "+
            "La división es: " + division
        );
    </script>

</body>
</html>
