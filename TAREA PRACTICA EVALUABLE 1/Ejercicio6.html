<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var numUsuario = parseInt(prompt("Dame un numero del 1 al 3: "));
        if(numUsuario >= 1){
            document.write("<h1>Encabezado nivel 1 </h1>");

        } if(numUsuario >= 2){
          
            document.write("<h2>Encabezado nivel 2 </h2>");

        } if(numUsuario >= 3){
          
            document.write("<h3>Encabezado nivel 3 </h3>");
        }

    </script>
</body>
</html>
