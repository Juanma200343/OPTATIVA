<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var respuesta;
        var acertado = false;

        for (var i = 0; i < 3; i++) {
        respuesta = prompt("¿Quién es el pintor de las Meninas?");

        if (respuesta === "Velázquez") {
        acertado = true;
        break;
        }
}

    if (acertado) {
        alert("Correcto! Ha acertado.");
    } else {
        alert("Lo siento! La respuesta correcta es Velázquez");
    }
    </script>
</body>
</html>
