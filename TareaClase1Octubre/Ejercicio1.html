<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var cadena = prompt("Dame una cadena: ");
        var numerocad = prompt("Dame numero para el caracter de la cadena: ")
        var caracter = cadena.charAt(numerocad); 
 

       alert("En la posición " + numerocad + 
              " de la cadena '" + cadena + 
              "' se encuentra el carácter '" + caracter + "'.");

        document.write(cadena.toUpperCase());

    </script>
</body>
</html>
